# data/site.toml
#
# Every sentence this app says, grouped by the surface it appears on.
#
# The contract is one way: every key named in `REQUIRED_SITE_KEYS`
# (lib/site/schema.ts) must exist here, extra keys are allowed and only the
# component that knows about them reads them.
#
# TOML trap: once an array of tables starts, every bare key after it belongs to
# the last element of that array. So each section's plain fields come first.


# === Brand =================================================================
[brand]
displayName = "Lumina Reach Analytics"

logoPrefix = "lumina"
logoAccent = "reach"

footerName = "LuminaReach"


# === <head> ================================================================
[seo]
locale = "en_US"
title = "Lumina Reach Analytics: AI Agent for Paid Search Analytics"
description = "An AI analytics agent for a paid search agency network. Ask in plain English about attribution, budget pacing, Google vs Microsoft efficiency and wasted spend, and get answers computed from the Snowflake warehouse, with the SQL behind them."
keywords = [
    "Paid Search",
    "Marketing Analytics",
    "Multi-Touch Attribution",
    "Budget Pacing",
    "Google Ads",
    "Microsoft Advertising",
    "Text-to-SQL",
    "AI Agent",
]


# === The four business threads. Exactly four ==============================
#
# One config, rendered twice: the capability cards on the home page and the
# insight cards on the agent welcome screen.
#
#   title    the concept name. Precise to an insider, opaque to everyone else
#   subtitle one plain sentence. This is what a stranger reads first
#   tooltip  two or three sentences: define the term, then say what moves it
#
# No jargon inside a tooltip. Explaining one insider word with another is the
# mistake this field exists to prevent.
#
# This used to be two arrays, `home.capabilities` and `chat.insights`, naming
# the same four things in two vocabularies. They had already drifted: the
# second thread was "Portfolio Concentration" on one screen and "Portfolio
# Health" on the other, with a different icon and no tooltip.

[[capabilities]]
icon = "Target"
title = "Attribution Truth"
subtitle = "Which channels really earn the conversions, not just the last click"
tooltip = "A customer usually sees a brand several times before buying: a display ad, a social post, then a search. Last-click reporting gives all the credit to that final search. Putting six crediting rules side by side shows how much value the earlier touches create and the standard report hides."

[[capabilities]]
icon = "DollarSign"
title = "Budget Efficiency"
subtitle = "Whether each campaign spends its budget well, and where more budget would pay"
tooltip = "Every campaign has a daily spending limit that changes over time. This compares what each campaign spent with the limit in force that day, checks automated bidding against the cost-per-sale it was told to hit, and finds campaigns turned away from auctions only because their money ran out."

[[capabilities]]
icon = "BarChart3"
title = "Engine and Device Efficiency"
subtitle = "Google vs Microsoft, phone vs desktop: where a sale costs least"
tooltip = "The same ad budget buys different results on different search engines and devices. Microsoft's clicks are cheaper but convert less often; phones get most of the views while desktops convert best. Comparing them on cost per sale, not on clicks, shows where money is best spent."

[[capabilities]]
icon = "AlertTriangle"
title = "Waste Governance"
subtitle = "Spend that bought clicks but no sales, and searches nobody chose to bid on"
tooltip = "Some spend never turns into a sale: keywords that collect clicks without converting, and loosely matched searches the advertiser never picked. Each one is small, so it never stands out in a monthly total. Listed together, they become a weekly clean-up list with a dollar figure attached."


# === Home page =============================================================
[home]
tagline = "Paid Search Analytics Agent"

description = "An AI agent for the analytics team of a paid search agency network. Ask about attribution, budget pacing, engine and device efficiency, or wasted spend in plain English, and get answers computed directly from the warehouse, with the SQL to check them."

blurb = "Analyzing a paid search warehouse: 21 tables and 2 views, ~558,000 records covering 80 advertisers, 1,024 campaigns, daily performance, search terms and conversion paths"

techStack = ["Strands Agents", "Amazon Bedrock AgentCore", "Snowflake", "Next.js"]

[home.headline]
prefix = "Lumina Reach "
accent = "Analytics"

[home.cta]
title = "Start Analyzing"
subtitle = "Ask questions about the paid search portfolio in plain English"

# Labels for the overlay that renders business-context.md.
[home.businessContext]
triggerLabel = "What problem does this solve?"
title = "The business behind the agent"
subtitle = "An agency network can grow its clients' spend and still lose them, because the waste and the mis-credited channels never show up in a monthly report. This is where they hide, and what this agent does about them."


# === Agent page ============================================================
[chat]
agent = "Lumina Reach Analyst"
welcomeSubtitle = "Ask questions about the paid search portfolio in plain English."
tryExamples = "Try: \"Which engine has the lower CPA?\" or \"Which campaigns are limited by budget?\""

suggestionsHint = "Ask me directly or click a suggestion"
inputPlaceholder = "Enter your question..."

[chat.messages]
# A whole sentence: the banner prints it as-is. It used to be a fragment that
# a component wrapped in "I'm here to help you with ...", and the two halves
# drifted into printing the frame twice.
welcomeMessage = "I'm here to help you with paid search analytics."
waitForResponse = "Wait for the current answer to finish first."


# === kickstart questions: exactly 12 ======================================
#
# Every one is a rewrite of a line in the Analysis Index of system-prompt.md.
# Nothing here may ask for an analysis the prompt does not teach.
#
# Render quota, exactly 3 of each:
#
#   table      "as a Markdown table" and "show the SQL"
#   flowchart  "as a flowchart"
#   chart      "as a bar chart" or "as a line chart"
#   free       none of those phrases may appear
#
# The render field draws the icon on the button, the phrase is what actually
# makes the block appear. `mise run check` verifies both directions.

# === free 1 / 3 ===
[[chat.suggestedActions]]
render = "free"
title = "Introduction"
label = "What can you do?"
action = "What can you help me analyze? Give me a short tour of the portfolio and the kinds of questions you answer well."

# === chart 1 / 3 (bar, two series: a gap) ===
[[chat.suggestedActions]]
render = "chart"
title = "Attribution Gap"
label = "What does last-click hide?"
action = "For each channel, give me the conversion value it earns under last-click and under first-click attribution. Show it as a bar chart with one series for each model, then say in one line which channels last-click under-credits."

# === flowchart 1 / 3 (structure with counts) ===
[[chat.suggestedActions]]
render = "flowchart"
title = "Account Structure"
label = "How is the portfolio organized?"
action = "Count the advertisers, engine accounts, campaigns, ad groups and keywords in the portfolio, and trace how each level contains the next. Put the count on each level. Show it as a flowchart."

# === table 1 / 3 (pacing list) ===
[[chat.suggestedActions]]
render = "table"
title = "Budget Pacing"
label = "Who is overspending their budget?"
action = "Over the last 7 days, list the ten campaigns with the highest pacing. Give me the campaign name, spend, the budget in effect, and pacing. Show it as a Markdown table, and show the SQL you ran."

# === free 2 / 3 ===
[[chat.suggestedActions]]
render = "free"
title = "Engine Choice"
label = "Should we move budget to Microsoft?"
action = "Over the last 30 days, compare Google Ads and Microsoft Advertising on cost per click, conversion rate and CPA. Explain why the CPAs end up where they do, and say whether that is a reason to shift budget."

# === chart 2 / 3 (line: ordered scale) ===
[[chat.suggestedActions]]
render = "chart"
title = "CPA Trend"
label = "Is CPA getting better or worse?"
action = "Give me the CPA for each of the last 21 days. Show it as a line chart, then say in one line whether CPA is improving or getting worse."

# === table 2 / 3 (audit) ===
[[chat.suggestedActions]]
render = "table"
title = "Smart Bidding Audit"
label = "Which campaigns miss their Target CPA?"
action = "Over the last 30 days, list the campaigns on a Target CPA strategy whose actual CPA is above target. Give me the campaign name, target CPA, actual CPA, and how far over target they are. Show it as a Markdown table, and show the SQL you ran."

# === flowchart 2 / 3 (spend flow) ===
[[chat.suggestedActions]]
render = "flowchart"
title = "Where Search Spend Goes"
label = "How much spend matched no keyword?"
action = "Over the last 30 days, split search term spend into spend matched to a keyword and broad-match overflow, then split each into spend with and without conversions. Put the dollar amount on each step. Show it as a flowchart."

# === chart 3 / 3 (bar, ranking) ===
[[chat.suggestedActions]]
render = "chart"
title = "Device Efficiency"
label = "Which device converts cheapest?"
action = "Over the last 30 days, give me the CPA for Mobile, Desktop and Tablet. Show it as a bar chart, then say in one line how the share of impressions compares with the CPA."

# === table 3 / 3 (portfolio) ===
[[chat.suggestedActions]]
render = "table"
title = "Top Advertisers"
label = "Which brands carry the network?"
action = "List the ten advertisers with the most spend over the last 30 days. Give me the advertiser name, the managing agency, spend, and ROAS. Show it as a Markdown table, and show the SQL you ran."

# === flowchart 3 / 3 (journey through the funnel) ===
[[chat.suggestedActions]]
render = "flowchart"
title = "Customer Journey"
label = "Which channels open and close paths?"
action = "Trace how conversion paths move through the funnel: how many conversions start with an upper, mid and lower funnel channel, and how many end with each. Put the count on each stage. Show it as a flowchart."

# === free 3 / 3 ===
[[chat.suggestedActions]]
render = "free"
title = "Path Length"
label = "Is multi-touch attribution worth it?"
action = "How many touches do conversion paths take, and what share of conversions have more than two touches? Say whether paths are long enough for the choice of attribution model to matter."
